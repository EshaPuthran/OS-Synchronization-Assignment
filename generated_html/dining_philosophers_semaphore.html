
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Dining Philosophers - Semaphore Simulation</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
    text-align: center;
}

h1 {
    color: #8ec5ff;
}

.subtitle {
    color: #aab8ca;
}

.dashboard {
    max-width: 1200px;
    margin: 20px auto;

    display: grid;
    grid-template-columns: minmax(480px, 1fr) 330px;
    gap: 20px;
}

.simulation,
.side-panel {
    background: #1b293c;
    padding: 20px;
    border-radius: 18px;
}

.table {
    position: relative;
    width: 500px;
    height: 460px;
    max-width: 100%;
    margin: auto;
}

.circle {
    position: absolute;
    width: 250px;
    height: 250px;

    border-radius: 50%;
    background: #30435c;
    border: 8px solid #536d8e;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 20px;
    font-weight: bold;
}

.philosopher {
    position: absolute;

    width: 115px;
    min-height: 80px;

    padding: 10px 5px;

    border-radius: 15px;
    border: 2px solid #64748b;

    z-index: 3;

    font-size: 13px;
    font-weight: bold;

    transition: transform 0.4s ease,
                background 0.3s ease,
                box-shadow 0.3s ease;
}

#p0 {
    top: 0;
    left: 50%;
    transform: translateX(-50%);
}

#p1 {
    right: 0;
    top: 50%;
    transform: translateY(-50%);
}

#p2 {
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
}

#p3 {
    left: 0;
    top: 50%;
    transform: translateY(-50%);
}

/* Neighbour movement */

#p0.leaning {
    transform: translate(-50%, 18px);
}

#p1.leaning {
    transform: translate(-18px, -50%);
}

#p2.leaning {
    transform: translate(-50%, -18px);
}

#p3.leaning {
    transform: translate(18px, -50%);
}

/* Philosopher states */

.thinking {
    background: #286b83;
}

.hungry {
    background: #a87521;
}

.waiting {
    background: #a34b35;
    box-shadow: 0 0 14px #a34b35;
}

.holding {
    background: #53658d;
}

.eating {
    background: #23875b;
    box-shadow: 0 0 18px #23875b;
    animation: pulse 0.8s infinite alternate;
}

.releasing {
    background: #6956a5;
}

.finished {
    background: #475569;
}

@keyframes pulse {
    from { box-shadow: 0 0 4px #23875b; }
    to { box-shadow: 0 0 22px #42df91; }
}

/* Forks */

.fork {
    position: absolute;

    width: 85px;
    padding: 12px 4px;

    border-radius: 10px;
    border: 2px solid #a9b8ca;

    background: #64748b;

    color: white;
    font-size: 12px;
    font-weight: bold;

    z-index: 4;

    transition: transform 0.4s ease,
                background 0.3s ease;
}

.fork.held {
    background: #e4a83c;
    border-color: #ffe1a0;
    color: #18202c;
}

#f0 {
    top: 100px;
    right: 85px;
}

#f1 {
    bottom: 100px;
    right: 85px;
}

#f2 {
    bottom: 100px;
    left: 85px;
}

#f3 {
    top: 100px;
    left: 85px;
}

.controls {
    margin: 12px;
}

button {
    padding: 11px 16px;
    margin: 5px;

    border: none;
    border-radius: 8px;

    background: #4285d4;
    color: white;

    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #65a4ed;
}

select {
    padding: 8px;
    border-radius: 7px;
}

#counter {
    color: #8ec5ff;
    font-size: 18px;
    font-weight: bold;
}

.status {
    background: #29394e;
    padding: 11px;
    margin: 8px 0;
    border-radius: 9px;
    text-align: left;
    font-size: 13px;
}

.wait-label {
    color: #ffc66d;
}

.hold-label {
    color: #8ec5ff;
}

#log {
    background: #111c2c;
    border-radius: 10px;
    padding: 12px;

    height: 230px;
    overflow-y: auto;

    text-align: left;
    font-size: 12px;
}

#log p {
    padding-bottom: 6px;
    border-bottom: 1px solid #29394e;
}

@media(max-width: 900px) {

    .dashboard {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

let index = 0;
let timer = null;
let speed = 850;


// --------------------------------------------------
// Display labels for philosopher states
// --------------------------------------------------

const displayState = {
    "Holding": "Acquiring Forks",
    "Releasing": "Releasing Forks"
};


// --------------------------------------------------
// Fork movement towards its owner
// --------------------------------------------------

const forkOffsets = {

    0: {
        0: [-12, -12],
        1: [12, 12]
    },

    1: {
        1: [12, -12],
        2: [-12, 12]
    },

    2: {
        2: [12, 12],
        3: [-12, -12]
    },

    3: {
        3: [-12, 12],
        0: [12, -12]
    }

};


// --------------------------------------------------
// Display an event
// --------------------------------------------------

function showEvent() {

    if (index >= events.length) {

        pause();
        return;

    }

    const event = events[index];


    // Remove old neighbour animations

    for (let i = 0; i < 4; i++) {

        document.getElementById("p" + i)
            .classList.remove("leaning");

    }


    // Update philosopher positions and states

    for (let i = 0; i < 4; i++) {

        const p = document.getElementById("p" + i);

        const state = event.philosophers[i];

        const held = event.held_forks[i];

        const requested = event.waiting_for[i];

        // Keep the original internal state for CSS styling.
        p.className =
            "philosopher " + state.toLowerCase();

        // Use readable labels in the visualization.
        let label = "P" + i + "<br>" +
            (displayState[state] || state);

        if (requested !== null) {

            label +=
                `<br><small class="wait-label">
                Waiting for F${requested}
                </small>`;

        }

        if (held.length > 0) {

            label +=
                `<br><small class="hold-label">
                Holding ${held.map(f => "F" + f).join(", ")}
                </small>`;

        }

        p.innerHTML = label;

    }


    // When a philosopher waits, their two neighbours
    // visually lean towards them.

    for (let i = 0; i < 4; i++) {

        if (event.philosophers[i] === "Waiting") {

            const left = (i + 3) % 4;
            const right = (i + 1) % 4;

            document.getElementById("p" + left)
                .classList.add("leaning");

            document.getElementById("p" + right)
                .classList.add("leaning");

        }

    }


    // Update fork ownership

    for (let i = 0; i < 4; i++) {

        const f = document.getElementById("f" + i);

        const owner = event.forks[i];

        if (owner === null) {

            f.innerHTML = "F" + i + "<br>Free";

            f.classList.remove("held");

            f.style.transform = "";

        } else {

            f.innerHTML =
                "F" + i + "<br>Held by P" + owner;

            f.classList.add("held");

            const offset = forkOffsets[i][owner];

            f.style.transform =
                `translate(${offset[0]}px, ${offset[1]}px) scale(1.1)`;

        }

    }


    // Update status panel

    document.getElementById("statuses").innerHTML =
        event.philosophers.map((state, i) => {

            const held = event.held_forks[i];

            const requested = event.waiting_for[i];

            let details = "";

            if (requested !== null) {

                details +=
                    `<br><span class="wait-label">
                    Waiting for F${requested}
                    </span>`;

            }

            if (held.length > 0) {

                details +=
                    `<br><span class="hold-label">
                    Holding: ${held.map(f => "F" + f).join(", ")}
                    </span>`;

            }

            return `
                <div class="status">
                    <strong>P${i}</strong> :
                    ${displayState[state] || state}
                    ${details}
                </div>
            `;

        }).join("");


    // Update fork panel

    document.getElementById("forkInfo").innerHTML =
        event.forks.map((owner, i) => {

            return `
                <div class="status">
                    <strong>F${i}</strong> :
                    ${
                        owner === null
                        ? "Free"
                        : "Held by P" + owner
                    }
                </div>
            `;

        }).join("");


    // Append event to log

    const log = document.getElementById("log");

    const entry = document.createElement("p");

    entry.textContent =
        "Event " + event.step + ": " + event.message;

    log.appendChild(entry);

    log.scrollTop = log.scrollHeight;


    // Event counter

    index++;

    document.getElementById("counter").innerText =
        "Event " + index + " of " + events.length;

}


// --------------------------------------------------
// Play
// --------------------------------------------------

function play() {

    if (timer !== null) return;

    if (index >= events.length) return;

    timer = setInterval(() => {

        if (index >= events.length) {

            pause();
            return;

        }

        showEvent();

    }, speed);

}


// --------------------------------------------------
// Pause
// --------------------------------------------------

function pause() {

    if (timer !== null) {

        clearInterval(timer);

        timer = null;

    }

}


// --------------------------------------------------
// Next event
// --------------------------------------------------

function next() {

    pause();

    showEvent();

}


// --------------------------------------------------
// Change speed
// --------------------------------------------------

function changeSpeed() {

    pause();

    speed = Number(
        document.getElementById("speed").value
    );

}


// --------------------------------------------------
// Reset screen
// --------------------------------------------------

function renderInitial() {

    for (let i = 0; i < 4; i++) {

        const p = document.getElementById("p" + i);

        p.className = "philosopher thinking";

        p.innerHTML =
            "P" + i + "<br>Thinking";

        const f = document.getElementById("f" + i);

        f.innerHTML =
            "F" + i + "<br>Free";

        f.classList.remove("held");

        f.style.transform = "";

    }

    document.getElementById("statuses").innerHTML = "";

    document.getElementById("forkInfo").innerHTML = "";

    document.getElementById("log").innerHTML = "";

    document.getElementById("counter").innerText =
        "Event 0 of " + events.length;

}


// --------------------------------------------------
// Restart
// --------------------------------------------------

function restart() {

    pause();

    index = 0;

    renderInitial();

}


// Initial display

renderInitial();

</script>
